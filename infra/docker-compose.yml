services:
  database:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: faculty_eval
      POSTGRES_USER: faculty_eval
      POSTGRES_PASSWORD: faculty_eval
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faculty_eval -d faculty_eval"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: faculty-evaluation-common-backend:0.1.0
    pull_policy: build
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/faculty_eval
      SPRING_DATASOURCE_USERNAME: faculty_eval
      SPRING_DATASOURCE_PASSWORD: faculty_eval
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "8080:8080"

  frontend:
    image: faculty-evaluation-common-frontend:0.1.0
    pull_policy: build
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:
