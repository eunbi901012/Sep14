openapi: 3.0.3
info:
  title: 교수업적평가시스템 공통기능 1차 API
  version: 0.1.0
servers:
  - url: /
security:
  - cookieAuth: []
paths:
  /api/auth/login:
    post:
      operationId: login
      summary: 로그인·로그아웃·현재 사용자 조회
      x-related-requirements:
        - REQ-031
      security: []
      x-business-rules:
        - REQ-031: 로그인 / 로그아웃 / 현재 사용자 조회 API를 제공한다.
      x-side-effects:
        - 관련 PostgreSQL 테이블 또는 세션 상태를 변경하고 후속 조회 결과에 반영한다.
      x-required-tests:
        - '{''happy'': ''유효한 요청 -> 후속 조회에서 저장 결과가 보인다''}'
        - '{''auth'': ''인증 없는 요청 -> 401 또는 403과 기존 상태 유지''}'
        - '{''validation'': ''필수 식별자 누락 -> 400 field error와 저장 없음''}'
        - '{''business'': ''원문 불변 규칙 위반 -> 400/403과 이전 값 유지''}'
        - '{''side-effect'': ''생성·수정일시 또는 상태 필드 -> 후속 조회에서 변경 흔적 확인''}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginId
                - password
              properties:
                loginId:
                  type: string
                  description: 아이디
                password:
                  type: string
                  description: password
      responses:
        '200':
          description: 정상 응답
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - authenticated
                          - userId
                          - loginId
                          - roleCodes
                        properties:
                          authenticated:
                            type: boolean
                            description: 인증 세션 생성 여부
                          userId:
                            type: string
                            description: 현재 사용자 식별자
                          loginId:
                            type: string
                            description: 아이디
                          roleCodes:
                            type: array
                            items:
                              $ref: '#/components/schemas/RoleCode'
                          defaultRoute:
                            type: string
                            description: 로그인 성공 후 진입 route
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 미인증
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
