                    properties:
                      data:
                        type: object
                        required:
                          - loggedOut
                        properties:
                          loggedOut:
                            type: boolean
                            description: 세션 종료 여부
        '400':
          description: 요청 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 미인증
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      x-no-request-body-reason: 요청 본문 없이 path 또는 세션 상태로 대상을 식별한다.
